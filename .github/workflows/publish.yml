name: Build and Push Docker Image

on:
  push:
    branches: [ "master" ] # Triggers the build every time you push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set lowercase repository name
        id: repo_name
        run: |
          # Convert repository name to lowercase using bash parameter expansion
          RAW_NAME="${{ github.event.repository.name }}"
          echo "lowercase=${RAW_NAME,,}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Combined your Docker Hub username and the new lowercase step output without spaces
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.repo_name.outputs.lowercase }}:latest


